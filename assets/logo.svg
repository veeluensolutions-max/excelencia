<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120" width="100%" height="100%" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&amp;family=Plus+Jakarta+Sans:wght@700;800&amp;display=swap');
      .logo-title {
        font-family: 'Montserrat', 'Plus Jakarta Sans', sans-serif;
        font-weight: 900;
        fill: #06402B;
        letter-spacing: 0.04em;
      }
      .logo-sub {
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-weight: 700;
        font-size: 11.5px;
        fill: #06402B;
        letter-spacing: 0.22em;
      }
    </style>
  </defs>

  <!-- Símbolo da Folha / Ramo Verde -->
  <g transform="translate(10, 12)" stroke="#06402B" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Caule central -->
    <path d="M48 92 C48 95 44 98 40 98 C36 98 32 95 32 92 L32 25" />
    
    <!-- Folha Superior/Direita -->
    <path d="M32 30 C32 10 58 4 72 20 C78 36 64 58 32 64" />
    
    <!-- Folha Média Direita -->
    <path d="M32 64 C42 66 68 70 70 82" />
    
    <!-- Folha Esquerda -->
    <path d="M32 50 C20 48 2 54 2 70 C2 86 24 88 32 90" />
  </g>

  <!-- Tipografia Oficial -->
  <g transform="translate(115, 0)">
    <!-- EXCELÊNCIA -->
    <text x="0" y="48" class="logo-title" font-size="42">EXCELÊNCIA</text>
    
    <!-- AMBIENTAL (com A estilizado em formato chevron) -->
    <g transform="translate(0, 85)">
      <!-- Letra A -->
      <path d="M 0 0 L 14 -32 L 28 0" stroke="#06402B" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      
      <!-- M B I E N T -->
      <text x="32" y="0" class="logo-title" font-size="40">MBIENT</text>
      
      <!-- Letra A -->
      <path d="M 216 0 L 230 -32 L 244 0" stroke="#06402B" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      
      <!-- Letra L -->
      <text x="248" y="0" class="logo-title" font-size="40">L</text>
    </g>
    
    <!-- ENGENHARIA E ANÁLISES TÉCNICAS -->
    <text x="2" y="108" class="logo-sub">ENGENHARIA E ANÁLISES TÉCNICAS</text>
  </g>
</svg>
